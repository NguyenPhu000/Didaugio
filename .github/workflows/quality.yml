name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_API_URL_PROD: https://api.didaugio.vn/api
      EXPO_PUBLIC_LEGAL_BASE_URL: https://didaugio.vn
      EXPO_PUBLIC_SENTRY_DSN: https://ci@o0.ingest.sentry.io/1
      SENTRY_AUTH_TOKEN: ci-validation-only
      SENTRY_ORG: nguyenphu
      SENTRY_PROJECT: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run validate:release-config
      - run: npm run validate:native-config
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  server:
    name: Server quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:e2e

  server-integration:
    name: Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: didaugio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d didaugio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/didaugio
      EMAIL_DELIVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate
      - run: npm run migrate:deploy
      - run: npm run migrate:verify
      - run: npm run test:integration
