groups:
  - name: didaugio-api
    interval: 30s
    rules:
      - alert: DidaugioApi5xxRateHigh
        expr: >-
          sum(rate(http_server_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_duration_seconds_count[5m])), 1) > 0.02
        for: 10m
        labels:
          service: didaugio-api
          severity: page
        annotations:
          summary: "iPoint Genie API 5xx rate is above 2%"
          description: "The API has returned more than 2% 5xx responses for 10 minutes."

      - alert: DidaugioApiP95LatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          service: didaugio-api
          severity: ticket
        annotations:
          summary: "iPoint Genie API p95 latency is above 1 second"
          description: "The aggregate API p95 latency has exceeded 1 second for 10 minutes."

      - alert: DidaugioDatabaseP95LatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(db_client_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 10m
        labels:
          service: didaugio-api
          severity: ticket
        annotations:
          summary: "iPoint Genie database p95 latency is above 500 ms"
          description: "Prisma database operations have exceeded 500 ms at p95 for 10 minutes."

      - alert: DidaugioApiMetricsMissing
        expr: absent(http_server_duration_seconds_count)
        for: 10m
        labels:
          service: didaugio-api
          severity: page
        annotations:
          summary: "iPoint Genie API metrics are missing"
          description: "The Prometheus scrape no longer exposes the API HTTP duration metric."
